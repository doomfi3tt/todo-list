<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #e8f4fc 0%, #d4e9f7 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 10px;
      font-size: 28px;
      font-weight: 600;
    }

    .stats {
      text-align: center;
      color: #4a7fb5;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* Tab 导航栏 */
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: white;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      color: #4a7fb5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #ebf8ff;
      border-color: #4299e1;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
      border-color: #3182ce;
    }

    /* 页面切换 */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* 添加按钮 */
    .add-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(66, 153, 225, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(66, 153, 225, 0.5);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 弹窗内容 */
    .modal {
      background: white;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal h2 {
      color: #2c5282;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .modal input[type="text"],
    .modal textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
    }

    .modal input:focus,
    .modal textarea:focus {
      border-color: #4299e1;
    }

    .modal textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #4a5568;
    }

    .btn-cancel:hover {
      background: #cbd5e0;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
    }

    .btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
    }

    /* 标签选择 */
    .tag-section {
      margin-top: 16px;
    }

    .tag-section label {
      display: block;
      font-size: 13px;
      color: #718096;
      margin-bottom: 8px;
    }

    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-option {
      padding: 8px 14px;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-option:hover {
      background: #edf2f7;
    }

    .tag-option.selected {
      background: #ebf8ff;
      border-color: #4299e1;
      color: #3182ce;
    }

    .tag-option input {
      display: none;
    }

    /* 任务标签显示 */
    .todo-item .tag {
      display: inline-block;
      padding: 2px 8px;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 11px;
      color: #4a5568;
      margin-left: 8px;
    }

    .todo-item.completed .tag {
      background: #c6f6d5;
      color: #276749;
    }

    /* 任务列表样式 */
    .todo-list {
      list-style: none;
      padding-bottom: 80px;
    }

    .todo-item {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      padding: 14px 16px;
      background: white;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(66, 153, 225, 0.1);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .todo-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.15);
    }

    .todo-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: #4299e1;
    }

    .todo-item .content {
      flex: 1;
      min-width: 150px;
    }

    .todo-item .title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .todo-item .text {
      font-size: 16px;
      color: #2d3748;
      transition: text-decoration 0.3s;
      word-break: break-word;
    }

    .todo-item.completed .text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .todo-item .desc {
      display: block;
      font-size: 14px;
      color: #4a5568;
      margin-top: 4px;
      word-break: break-word;
    }

    .todo-item .times {
      width: 100%;
      margin-top: 8px;
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .todo-item .time-item {
      display: flex;
      gap: 5px;
    }

    .todo-item .time-label {
      color: #718096;
    }

    .todo-item .time-value {
      color: #4a5568;
    }

    .todo-item.completed .time-value {
      color: #38a169;
    }

    .todo-item .delete-btn {
      width: 32px;
      height: 32px;
      margin-left: 10px;
      background: #fed7d7;
      color: #c53030;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .todo-item .delete-btn:hover {
      background: #feb2b2;
      transform: scale(1.1);
    }

    .todo-item .edit-btn {
      width: 32px;
      height: 32px;
      margin-left: 5px;
      background: #bee3f8;
      color: #3182ce;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .todo-item .edit-btn:hover {
      background: #90cdf4;
      transform: scale(1.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    /* 任务详情弹窗样式 */
    .detail-modal .modal {
      max-width: 450px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 600;
      color: #2c5282;
      flex: 1;
    }

    .detail-tags {
      margin-bottom: 15px;
    }

    .detail-tags .tag {
      display: inline-block;
      padding: 4px 10px;
      background: #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      color: #4a5568;
      margin-right: 8px;
    }

    .detail-section {
      margin-bottom: 15px;
    }

    .detail-section h4 {
      font-size: 13px;
      color: #718096;
      margin-bottom: 8px;
    }

    .detail-text {
      font-size: 14px;
      color: #2d3748;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .progress-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .progress-item {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .progress-time {
      font-size: 11px;
      color: #a0aec0;
      white-space: nowrap;
    }

    .progress-content {
      font-size: 13px;
      color: #4a5568;
      flex: 1;
    }

    .add-progress-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .add-progress-section textarea {
      min-height: 60px;
      margin-bottom: 10px;
    }

    .progress-empty {
      text-align: center;
      color: #a0aec0;
      font-size: 13px;
      padding: 20px;
    }

    .month-stats-page {
      padding-bottom: 80px;
    }

    .month-group {
      margin-bottom: 12px;
    }

    .month-header {
      background: white;
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(66, 153, 225, 0.1);
      transition: all 0.2s;
    }

    .month-header:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.15);
    }

    .month-title {
      font-weight: 600;
      color: #2c5282;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-count {
      font-size: 13px;
      color: #718096;
      min-width: 40px;
      text-align: right;
    }

    .month-bar-container {
      flex: 1;
      max-width: 150px;
      margin: 0 15px;
    }

    .month-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .month-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #48bb78 0%, #38a169 100%);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .month-tasks {
      display: none;
      padding: 10px 0 0 10px;
    }

    .month-tasks.show {
      display: block;
    }

    .month-task {
      display: flex;
      align-items: flex-start;
      padding: 10px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .month-task:hover {
      background: #edf2f7;
    }

    .month-task input[type="checkbox"] {
      margin-right: 10px;
      margin-top: 2px;
      accent-color: #48bb78;
    }

    .month-task .task-content {
      flex: 1;
    }

    .month-task .task-text {
      display: block;
      font-size: 14px;
      color: #2d3748;
      word-break: break-word;
    }

    .month-task .task-text .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 11px;
      color: #4a5568;
      margin-left: 8px;
    }

    .month-task .complete-time {
      display: block;
      font-size: 12px;
      color: #a0aec0;
      margin-top: 4px;
    }

    .stats-empty {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .stats-empty .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .add-btn {
        bottom: 20px;
        right: 20px;
        width: 55px;
        height: 55px;
        font-size: 28px;
      }

      h1 {
        font-size: 24px;
      }

      .todo-item .times {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>待办清单</h1>
    <p class="stats">已完成 <span id="completed-count">0</span> / <span id="total-count">0</span></p>

    <!-- Tab 导航 -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="todo">任务列表</button>
      <button class="tab-btn" data-tab="stats">月度统计</button>
    </div>

    <!-- 任务列表页面 -->
    <div class="page active" id="todo-page">
      <ul class="todo-list" id="todo-list"></ul>
    </div>

    <!-- 月度统计页面 -->
    <div class="page" id="stats-page">
      <div class="month-stats-page" id="month-stats-content">
        <div class="stats-empty">暂无已完成任务</div>
      </div>
    </div>
  </div>

  <!-- 添加按钮 -->
  <button class="add-btn" id="add-btn">+</button>

  <!-- 添加任务弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>添加新任务</h2>
      <input type="text" id="title-input" placeholder="输入任务标题" maxlength="50">
      <textarea id="todo-input" placeholder="输入任务内容（可选）" maxlength="500" style="margin-top: 12px;"></textarea>

      <!-- 时间类型 -->
      <div class="tag-section">
        <label>时间类型</label>
        <div class="tag-options" id="duration-tags">
          <label class="tag-option selected">
            <input type="radio" name="duration" value="长期" checked> 长期
          </label>
          <label class="tag-option">
            <input type="radio" name="duration" value="短期"> 短期
          </label>
        </div>
      </div>

      <!-- 甲方 -->
      <div class="tag-section">
        <label>甲方</label>
        <div class="tag-options" id="party-tags">
          <label class="tag-option selected">
            <input type="radio" name="party" value="CM" checked> CM
          </label>
          <label class="tag-option">
            <input type="radio" name="party" value="客户"> 客户
          </label>
        </div>
      </div>

      <!-- 分类 -->
      <div class="tag-section">
        <label>分类</label>
        <div class="tag-options" id="category-tags">
          <label class="tag-option selected">
            <input type="radio" name="category" value="采购" checked> 采购
          </label>
          <label class="tag-option">
            <input type="radio" name="category" value="生产"> 生产
          </label>
          <label class="tag-option">
            <input type="radio" name="category" value="其他"> 其他
          </label>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" id="btn-cancel">取消</button>
        <button class="btn-confirm" id="btn-confirm">添加</button>
      </div>
    </div>
  </div>

  <!-- 任务详情弹窗 -->
  <div class="modal-overlay detail-modal" id="detail-modal">
    <div class="modal">
      <div class="detail-header">
        <span class="detail-title" id="detail-title"></span>
      </div>
      <div class="detail-tags" id="detail-tags"></div>

      <div class="detail-section">
        <h4>任务内容</h4>
        <p class="detail-text" id="detail-text"></p>
      </div>

      <div class="detail-section">
        <h4>进度记录</h4>
        <div class="progress-list" id="progress-list"></div>
      </div>

      <div class="add-progress-section">
        <h4>添加进度</h4>
        <textarea id="progress-input" placeholder="记录最新进度..." maxlength="500"></textarea>
        <div class="modal-buttons">
          <button class="btn-cancel" id="btn-close-detail">关闭</button>
          <button class="btn-confirm" id="btn-add-progress">添加进度</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 从本地存储加载数据
    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let nextTodoId = parseInt(localStorage.getItem('nextTodoId')) || 1;

    const todoList = document.getElementById('todo-list');
    const completedCount = document.getElementById('completed-count');
    const totalCount = document.getElementById('total-count');
    const monthStatsContent = document.getElementById('month-stats-content');

    // 添加任务弹窗元素
    const addBtn = document.getElementById('add-btn');
    const modal = document.getElementById('modal');
    const titleInput = document.getElementById('title-input');
    const todoInput = document.getElementById('todo-input');
    const btnCancel = document.getElementById('btn-cancel');
    const btnConfirm = document.getElementById('btn-confirm');
    const durationTags = document.getElementById('duration-tags');
    const partyTags = document.getElementById('party-tags');
    const categoryTags = document.getElementById('category-tags');

    // 任务详情弹窗元素
    const detailModal = document.getElementById('detail-modal');
    const detailTitle = document.getElementById('detail-title');
    const detailTags = document.getElementById('detail-tags');
    const detailText = document.getElementById('detail-text');
    const progressList = document.getElementById('progress-list');
    const progressInput = document.getElementById('progress-input');
    const btnCloseDetail = document.getElementById('btn-close-detail');
    const btnAddProgress = document.getElementById('btn-add-progress');

    let currentTodoId = null;

    // 打开添加弹窗
    addBtn.addEventListener('click', () => {
      modal.classList.add('show');
      titleInput.value = '';
      todoInput.value = '';
      resetTagSelection();
      titleInput.focus();
    });

    // 重置标签选择
    function resetTagSelection() {
      document.querySelectorAll('.tag-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      durationTags.querySelector('.tag-option').classList.add('selected');
      partyTags.querySelector('.tag-option').classList.add('selected');
      categoryTags.querySelector('.tag-option').classList.add('selected');
    }

    // 标签点击选择
    document.querySelectorAll('.tag-option').forEach(option => {
      option.addEventListener('click', () => {
        const parent = option.parentElement;
        parent.querySelectorAll('.tag-option').forEach(opt => {
          opt.classList.remove('selected');
        });
        option.classList.add('selected');
      });
    });

    // 关闭弹窗
    function closeModal() {
      modal.classList.remove('show');
    }

    btnCancel.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // 确认添加
    btnConfirm.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    // Tab 切换
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.page').forEach(page => {
          page.classList.remove('active');
        });
        document.getElementById(`${tab}-page`).classList.add('active');
        if (tab === 'stats') renderMonthlyStats();
      });
    });

    // 格式化时间
    function formatTime(timestamp) {
      if (!timestamp) return '-';
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    // 获取月份Key
    function getMonthKey(timestamp) {
      if (!timestamp) return null;
      const date = new Date(timestamp);
      return `${date.getFullYear()}年${date.getMonth() + 1}月`;
    }

    // 按月份分组已完成任务
    function getCompletedByMonth() {
      const completed = todos.filter(t => t.completed && t.completedAt);
      const grouped = {};
      completed.forEach(todo => {
        const key = getMonthKey(todo.completedAt);
        if (key) {
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(todo);
        }
      });
      return grouped;
    }

    // 按月份分组所有任务（已完成和未完成）
    function getAllByMonth() {
      const grouped = {};
      todos.forEach(todo => {
        const key = getMonthKey(todo.createdAt);
        if (key) {
          if (!grouped[key]) grouped[key] = { total: 0, completed: 0, tasks: [] };
          grouped[key].total++;
          if (todo.completed) grouped[key].completed++;
          grouped[key].tasks.push(todo);
        }
      });
      return grouped;
    }

    // 渲染月度统计
    function renderMonthlyStats() {
      const grouped = getAllByMonth();
      const months = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
      if (months.length === 0) {
        monthStatsContent.innerHTML = '<div class="stats-empty">暂无任务数据</div>';
        return;
      }
      let html = '';
      months.forEach(month => {
        const data = grouped[month];
        const { total, completed, tasks } = data;
        const percentage = total > 0 ? (completed / total) * 100 : 0;
        const completedTasks = tasks.filter(t => t.completed).sort((a, b) => b.completedAt - a.completedAt);

        let tasksHtml = '';
        if (completedTasks.length > 0) {
          completedTasks.forEach(todo => {
            const tag = todo.tag || { duration: '长期', party: 'CM', category: '采购' };
            tasksHtml += `
                <div class="month-task" onclick="openTaskFromStats(${todo.id || 0})">
                  <input type="checkbox" checked disabled>
                  <div class="task-content">
                    <span class="task-text">
                      <strong>${escapeHtml(todo.title)}</strong>
                      <span class="tag">${tag.duration} · ${tag.party} · ${tag.category}</span>
                    </span>
                    <span class="complete-time">${formatTime(todo.completedAt)}</span>
                  </div>
                </div>`;
          });
        } else {
          tasksHtml = '<div class="progress-empty">该月暂无完成的任务</div>';
        }

        html += `
          <div class="month-group">
            <div class="month-header" onclick="toggleMonth(this)">
              <span class="month-title">${month}</span>
              <div class="month-bar-container">
                <div class="month-bar">
                  <div class="month-bar-fill" style="width: ${percentage}%"></div>
                </div>
              </div>
              <span class="month-count">${completed}/${total}</span>
            </div>
            <div class="month-tasks">
              ${tasksHtml}
            </div>
          </div>`;
      });
      monthStatsContent.innerHTML = html;
    }

    window.toggleMonth = function(header) {
      header.nextElementSibling.classList.toggle('show');
    };

    window.openTaskFromStats = function(todoId) {
      const index = todos.findIndex(t => t.id === todoId);
      if (index !== -1) {
        // 切换到任务列表页面
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-tab="todo"]').classList.add('active');
        document.querySelectorAll('.page').forEach(page => {
          page.classList.remove('active');
        });
        document.getElementById('todo-page').classList.add('active');
        openDetail(index);
      }
    };

    // 打开任务详情
    function openDetail(index) {
      const todo = todos[index];
      currentTodoId = index;
      detailTitle.textContent = todo.title;
      detailText.textContent = todo.text || '无';
      const tag = todo.tag || { duration: '长期', party: 'CM', category: '采购' };
      detailTags.innerHTML = `
        <span class="tag">${tag.duration}</span>
        <span class="tag">${tag.party}</span>
        <span class="tag">${tag.category}</span>
      `;

      // 渲染进度记录
      const progress = todo.progress || [];
      if (progress.length === 0) {
        progressList.innerHTML = '<div class="progress-empty">暂无进度记录</div>';
      } else {
        progressList.innerHTML = progress.map(p => `
          <div class="progress-item">
            <span class="progress-time">${formatTime(p.time)}</span>
            <span class="progress-content">${escapeHtml(p.content)}</span>
          </div>
        `).join('');
      }

      progressInput.value = '';
      detailModal.classList.add('show');
    }

    // 关闭详情弹窗
    function closeDetail() {
      detailModal.classList.remove('show');
      currentTodoId = null;
    }

    btnCloseDetail.addEventListener('click', closeDetail);
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeDetail();
    });

    // 添加进度
    btnAddProgress.addEventListener('click', () => {
      const content = progressInput.value.trim();
      if (content && currentTodoId !== null) {
        if (!todos[currentTodoId].progress) {
          todos[currentTodoId].progress = [];
        }
        todos[currentTodoId].progress.push({
          content,
          time: Date.now()
        });
        saveTodos();
        renderTodos();
        openDetail(currentTodoId);
      }
    });

    // 渲染任务列表
    function renderTodos() {
      todoList.innerHTML = '';
      if (todos.length === 0) {
        todoList.innerHTML = `
          <li class="empty-state">
            <div class="icon">📝</div>
            <p>暂无任务</p>
          </li>
        `;
      } else {
        todos.forEach((todo, index) => {
          const tag = todo.tag || { duration: '长期', party: 'CM', category: '采购' };
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
          li.innerHTML = `
            <input type="checkbox" ${todo.completed ? 'checked' : ''}>
            <div class="content">
              <div class="title-row">
                <span class="text">${escapeHtml(todo.title)}</span>
                <span class="tag">${tag.duration} · ${tag.party} · ${tag.category}</span>
              </div>
              ${todo.text ? `<span class="desc">${escapeHtml(todo.text)}</span>` : ''}
              <div class="times">
                <span class="time-item">
                  <span class="time-label">添加:</span>
                  <span class="time-value">${formatTime(todo.createdAt)}</span>
                </span>
                <span class="time-item">
                  <span class="time-label">完成:</span>
                  <span class="time-value">${formatTime(todo.completedAt)}</span>
                </span>
                ${(todo.progress && todo.progress.length) ? `
                <span class="time-item">
                  <span class="time-label">进度:</span>
                  <span class="time-value">${todo.progress.length}条</span>
                </span>
                ` : ''}
              </div>
            </div>
            <button class="edit-btn" title="详情">✎</button>
            <button class="delete-btn" title="删除">×</button>
          `;

          // 点击任务项打开详情（除了复选框和按钮）
          li.addEventListener('click', (e) => {
            if (!e.target.classList.contains('delete-btn') &&
                !e.target.classList.contains('edit-btn') &&
                !e.target.matches('input[type="checkbox"]')) {
              openDetail(index);
            }
          });

          // 复选框点击
          li.querySelector('input').addEventListener('change', (e) => {
            e.stopPropagation();
            const wasCompleted = todos[index].completed;
            todos[index].completed = !wasCompleted;
            todos[index].completedAt = !wasCompleted ? Date.now() : null;
            saveTodos();
            renderTodos();
          });

          // 编辑按钮
          li.querySelector('.edit-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openDetail(index);
          });

          // 删除按钮
          li.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            todos.splice(index, 1);
            saveTodos();
            renderTodos();
          });

          todoList.appendChild(li);
        });
      }

      // 更新统计
      const completed = todos.filter(t => t.completed).length;
      completedCount.textContent = completed;
      totalCount.textContent = todos.length;
    }

    // 保存到本地存储
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
      localStorage.setItem('nextTodoId', nextTodoId);
    }

    // HTML 转义
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 添加任务
    function addTodo() {
      const title = titleInput.value.trim();
      const text = todoInput.value.trim();
      if (title) {
        const { duration, party, category } = getSelectedTags();
        const id = nextTodoId++;
        todos.unshift({
          id,
          title,
          text,
          tag: { duration, party, category },
          completed: false,
          createdAt: Date.now(),
          completedAt: null,
          progress: []
        });
        saveTodos();
        renderTodos();
        closeModal();
      }
    }

    function getSelectedTags() {
      const duration = durationTags.querySelector('.tag-option.selected input').value;
      const party = partyTags.querySelector('.tag-option.selected input').value;
      const category = categoryTags.querySelector('.tag-option.selected input').value;
      return { duration, party, category };
    }

    // 初始渲染
    renderTodos();
  </script>
</body>
</html>
