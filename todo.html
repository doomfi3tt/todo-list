<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #e8f4fc 0%, #d4e9f7 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 10px;
      font-size: 28px;
      font-weight: 600;
    }

    .stats {
      text-align: center;
      color: #4a7fb5;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-section input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-section input:focus {
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
    }

    .input-section button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-section button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
    }

    .input-section button:active {
      transform: translateY(0);
    }

    .toggle-stats {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      background: white;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      color: #4299e1;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-stats:hover {
      background: #ebf8ff;
      border-color: #4299e1;
    }

    .monthly-stats {
      display: none;
      margin-bottom: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(66, 153, 225, 0.1);
      overflow: hidden;
    }

    .monthly-stats.show {
      display: block;
    }

    .monthly-stats h2 {
      padding: 14px 16px;
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
      font-size: 16px;
      font-weight: 500;
    }

    .month-group {
      border-bottom: 1px solid #e2e8f0;
    }

    .month-group:last-child {
      border-bottom: none;
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f7fafc;
      cursor: pointer;
      transition: background 0.2s;
    }

    .month-header:hover {
      background: #edf2f7;
    }

    .month-title {
      font-weight: 600;
      color: #2d3748;
    }

    .month-count {
      background: #48bb78;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .month-tasks {
      display: none;
      padding: 8px 16px 12px;
    }

    .month-tasks.show {
      display: block;
    }

    .month-task {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #edf2f7;
    }

    .month-task:last-child {
      border-bottom: none;
    }

    .month-task input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-right: 10px;
      accent-color: #48bb78;
      cursor: pointer;
    }

    .month-task span {
      flex: 1;
      font-size: 14px;
      color: #4a5568;
      word-break: break-word;
    }

    .month-task .complete-time {
      font-size: 12px;
      color: #a0aec0;
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 14px 16px;
      background: white;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(66, 153, 225, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .todo-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.15);
    }

    .todo-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #4299e1;
    }

    .todo-item .content {
      flex: 1;
      min-width: 150px;
    }

    .todo-item .text {
      display: block;
      font-size: 16px;
      color: #2d3748;
      transition: text-decoration 0.3s;
      word-break: break-word;
    }

    .todo-item.completed .text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .todo-item .times {
      width: 100%;
      margin-top: 8px;
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      gap: 15px;
    }

    .todo-item .time-item {
      display: flex;
      gap: 5px;
    }

    .todo-item .time-label {
      color: #718096;
    }

    .todo-item .time-value {
      color: #4a5568;
    }

    .todo-item.completed .time-value {
      color: #38a169;
    }

    .todo-item .delete-btn {
      width: 32px;
      height: 32px;
      margin-left: 10px;
      background: #fed7d7;
      color: #c53030;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .todo-item .delete-btn:hover {
      background: #feb2b2;
      transform: scale(1.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .stats-empty {
      padding: 30px 16px;
      text-align: center;
      color: #a0aec0;
    }

    @media (max-width: 480px) {
      .input-section {
        flex-direction: column;
      }

      .input-section button {
        width: 100%;
      }

      h1 {
        font-size: 24px;
      }

      .todo-item .times {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>待办清单</h1>
    <p class="stats">已完成 <span id="completed-count">0</span> / <span id="total-count">0</span></p>

    <div class="input-section">
      <input type="text" id="todo-input" placeholder="添加新任务..." maxlength="100">
      <button id="add-btn">添加</button>
    </div>

    <button class="toggle-stats" id="toggle-stats">显示月度统计</button>

    <div class="monthly-stats" id="monthly-stats">
      <h2>月度统计</h2>
      <div id="stats-content"></div>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script>
    // 从本地存储加载数据
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const completedCount = document.getElementById('completed-count');
    const totalCount = document.getElementById('total-count');
    const toggleStats = document.getElementById('toggle-stats');
    const monthlyStats = document.getElementById('monthly-stats');
    const statsContent = document.getElementById('stats-content');

    // 格式化时间
    function formatTime(timestamp) {
      if (!timestamp) return '-';
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    // 获取月份Key（格式：2026年1月）
    function getMonthKey(timestamp) {
      if (!timestamp) return null;
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      return `${year}年${month}月`;
    }

    // 按月份分组已完成任务
    function getCompletedByMonth() {
      const completed = todos.filter(t => t.completed && t.completedAt);
      const grouped = {};

      completed.forEach(todo => {
        const key = getMonthKey(todo.completedAt);
        if (key) {
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(todo);
        }
      });

      return grouped;
    }

    // 渲染月度统计
    function renderMonthlyStats() {
      const grouped = getCompletedByMonth();
      const months = Object.keys(grouped).sort((a, b) => {
        return new Date(b) - new Date(a);
      });

      if (months.length === 0) {
        statsContent.innerHTML = '<div class="stats-empty">暂无已完成任务</div>';
        return;
      }

      statsContent.innerHTML = months.map(month => {
        const tasks = grouped[month];
        return `
          <div class="month-group">
            <div class="month-header" onclick="toggleMonth(this)">
              <span class="month-title">${month}</span>
              <span class="month-count">${tasks.length}个</span>
            </div>
            <div class="month-tasks">
              ${tasks.map(todo => `
                <div class="month-task">
                  <input type="checkbox" checked disabled>
                  <span>${escapeHtml(todo.text)}</span>
                  <span class="complete-time">${formatTime(todo.completedAt)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // 切换月份展开/收起
    window.toggleMonth = function(header) {
      const tasks = header.nextElementSibling;
      tasks.classList.toggle('show');
    };

    // 切换统计显示
    toggleStats.addEventListener('click', () => {
      monthlyStats.classList.toggle('show');
      toggleStats.textContent = monthlyStats.classList.contains('show')
        ? '隐藏月度统计'
        : '显示月度统计';
      if (monthlyStats.classList.contains('show')) {
        renderMonthlyStats();
      }
    });

    // 渲染任务列表
    function renderTodos() {
      todoList.innerHTML = '';

      if (todos.length === 0) {
        todoList.innerHTML = `
          <li class="empty-state">
            <div class="icon">📝</div>
            <p>暂无任务</p>
          </li>
        `;
      } else {
        todos.forEach((todo, index) => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
          li.innerHTML = `
            <input type="checkbox" ${todo.completed ? 'checked' : ''}>
            <div class="content">
              <span class="text">${escapeHtml(todo.text)}</span>
              <div class="times">
                <span class="time-item">
                  <span class="time-label">添加:</span>
                  <span class="time-value">${formatTime(todo.createdAt)}</span>
                </span>
                <span class="time-item">
                  <span class="time-label">完成:</span>
                  <span class="time-value">${formatTime(todo.completedAt)}</span>
                </span>
              </div>
            </div>
            <button class="delete-btn" title="删除">×</button>
          `;

          // 复选框点击事件
          li.querySelector('input').addEventListener('change', () => {
            const wasCompleted = todos[index].completed;
            todos[index].completed = !wasCompleted;
            todos[index].completedAt = !wasCompleted ? Date.now() : null;
            saveTodos();
            renderTodos();
          });

          // 删除按钮点击事件
          li.querySelector('.delete-btn').addEventListener('click', () => {
            todos.splice(index, 1);
            saveTodos();
            renderTodos();
          });

          todoList.appendChild(li);
        });
      }

      // 更新统计
      const completed = todos.filter(t => t.completed).length;
      completedCount.textContent = completed;
      totalCount.textContent = todos.length;
    }

    // 保存到本地存储
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    // HTML 转义防止 XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 添加任务
    function addTodo() {
      const text = todoInput.value.trim();
      if (text) {
        todos.push({
          text,
          completed: false,
          createdAt: Date.now(),
          completedAt: null
        });
        saveTodos();
        renderTodos();
        todoInput.value = '';
        todoInput.focus();
      }
    }

    // 事件监听
    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    // 初始渲染
    renderTodos();
  </script>
</body>
</html>
