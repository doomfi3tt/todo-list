<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #e8f4fc 0%, #d4e9f7 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 10px;
      font-size: 28px;
      font-weight: 600;
    }

    .stats {
      text-align: center;
      color: #4a7fb5;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* 搜索框 */
    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      border-color: #4299e1;
    }

    .search-box input::placeholder {
      color: #a0aec0;
    }

    /* 标签筛选 */
    .filter-section {
      margin-bottom: 15px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-label {
      font-size: 13px;
      color: #718096;
      min-width: 40px;
    }

    .filter-btn {
      padding: 6px 12px;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: #edf2f7;
    }

    .filter-btn.active {
      background: #ebf8ff;
      border-color: #4299e1;
      color: #3182ce;
    }

    /* Tab 导航栏 */
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: white;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      color: #4a7fb5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #ebf8ff;
      border-color: #4299e1;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
      border-color: #3182ce;
    }

    /* 页面切换 */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* 添加按钮 */
    .add-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(66, 153, 225, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(66, 153, 225, 0.5);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 弹窗内容 */
    .modal {
      background: white;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal h2 {
      color: #2c5282;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .modal input[type="text"],
    .modal textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #b8d4e8;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
    }

    .modal input:focus,
    .modal textarea:focus {
      border-color: #4299e1;
    }

    .modal textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #4a5568;
    }

    .btn-cancel:hover {
      background: #cbd5e0;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: white;
    }

    .btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
    }

    /* 标签选择 */
    .tag-section {
      margin-top: 16px;
    }

    .tag-section label {
      display: block;
      font-size: 13px;
      color: #718096;
      margin-bottom: 8px;
    }

    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-option {
      padding: 8px 14px;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-option:hover {
      background: #edf2f7;
    }

    .tag-option.selected {
      background: #ebf8ff;
      border-color: #4299e1;
      color: #3182ce;
    }

    .tag-option input {
      display: none;
    }

    /* 任务标签显示 */
    .todo-item .tag {
      display: inline-block;
      padding: 2px 8px;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 11px;
      color: #4a5568;
      margin-left: 8px;
    }

    .todo-item.completed .tag {
      background: #c6f6d5;
      color: #276749;
    }

    /* 任务列表样式 */
    .todo-list {
      list-style: none;
      padding-bottom: 80px;
    }

    .todo-item {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      padding: 14px 16px;
      background: white;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(66, 153, 225, 0.1);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .todo-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.15);
    }

    .todo-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: #4299e1;
    }

    .todo-item .content {
      flex: 1;
      min-width: 150px;
    }

    .todo-item .title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .todo-item .text {
      font-size: 16px;
      color: #2d3748;
      transition: text-decoration 0.3s;
      word-break: break-word;
    }

    .todo-item.completed .text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .todo-item .desc {
      display: block;
      font-size: 14px;
      color: #4a5568;
      margin-top: 4px;
      word-break: break-word;
    }

    .todo-item .times {
      width: 100%;
      margin-top: 8px;
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .todo-item .time-item {
      display: flex;
      gap: 5px;
    }

    .todo-item .time-label {
      color: #718096;
    }

    .todo-item .time-value {
      color: #4a5568;
    }

    .todo-item.completed .time-value {
      color: #38a169;
    }

    .todo-item.overdue {
      border-left: 3px solid #e53e3e;
      background: #fff5f5;
    }

    .todo-item.overdue .text {
      color: #c53030;
    }

    .overdue-time .time-value {
      color: #e53e3e;
      font-weight: 500;
    }

    .reminder-item .time-value {
      color: #805ad5;
      font-weight: 500;
    }

    .todo-item .delete-btn {
      width: 32px;
      height: 32px;
      margin-left: 10px;
      background: #fed7d7;
      color: #c53030;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .todo-item .delete-btn:hover {
      background: #feb2b2;
      transform: scale(1.1);
    }

    .todo-item .edit-btn {
      width: 32px;
      height: 32px;
      margin-left: 5px;
      background: #bee3f8;
      color: #3182ce;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .todo-item .edit-btn:hover {
      background: #90cdf4;
      transform: scale(1.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    /* 任务详情弹窗样式 */
    .detail-modal .modal {
      max-width: 450px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 600;
      color: #2c5282;
      flex: 1;
    }

    .detail-tags {
      margin-bottom: 15px;
    }

    .detail-tags .tag {
      display: inline-block;
      padding: 4px 10px;
      background: #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      color: #4a5568;
      margin-right: 8px;
    }

    .detail-section {
      margin-bottom: 15px;
    }

    .detail-section h4 {
      font-size: 13px;
      color: #718096;
      margin-bottom: 8px;
    }

    .detail-text {
      font-size: 14px;
      color: #2d3748;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .progress-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .progress-item {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .progress-time {
      font-size: 11px;
      color: #a0aec0;
      white-space: nowrap;
    }

    .progress-content {
      font-size: 13px;
      color: #4a5568;
      flex: 1;
    }

    .add-progress-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .add-progress-section textarea {
      min-height: 60px;
      margin-bottom: 10px;
    }

    .progress-empty {
      text-align: center;
      color: #a0aec0;
      font-size: 13px;
      padding: 20px;
    }

    .month-stats-page {
      padding-bottom: 80px;
    }

    .month-group {
      margin-bottom: 12px;
    }

    .month-header {
      background: white;
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(66, 153, 225, 0.1);
      transition: all 0.2s;
    }

    .month-header:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.15);
    }

    .month-title {
      font-weight: 600;
      color: #2c5282;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-count {
      font-size: 13px;
      color: #718096;
      min-width: 40px;
      text-align: right;
    }

    .month-bar-container {
      flex: 1;
      max-width: 150px;
      margin: 0 15px;
    }

    .month-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .month-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #48bb78 0%, #38a169 100%);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .month-tasks {
      display: none;
      padding: 10px 0 0 10px;
    }

    .month-tasks.show {
      display: block;
    }

    .month-task {
      display: flex;
      align-items: flex-start;
      padding: 10px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .month-task:hover {
      background: #edf2f7;
    }

    .month-task.overdue {
      background: #fff5f5;
      border-left: 3px solid #e53e3e;
    }

    .month-task.overdue:hover {
      background: #fed7d7;
    }

    .month-task input[type="checkbox"] {
      margin-right: 10px;
      margin-top: 2px;
      accent-color: #48bb78;
    }

    .month-task .task-content {
      flex: 1;
    }

    .month-task .task-text {
      display: block;
      font-size: 14px;
      color: #2d3748;
      word-break: break-word;
    }

    .month-task .task-text .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 11px;
      color: #4a5568;
      margin-left: 8px;
    }

    .month-task .complete-time {
      display: block;
      font-size: 12px;
      color: #a0aec0;
      margin-top: 4px;
    }

    .stats-empty {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .stats-empty .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .add-btn {
        bottom: 20px;
        right: 20px;
        width: 55px;
        height: 55px;
        font-size: 28px;
      }

      h1 {
        font-size: 24px;
      }

      .todo-item .times {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>待办清单</h1>
    <p class="stats">已完成 <span id="completed-count">0</span> / <span id="total-count">0</span></p>

    <!-- Tab 导航 -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="todo">任务列表</button>
      <button class="tab-btn" data-tab="stats">月度统计</button>
    </div>

    <!-- 任务列表页面 -->
    <div class="page active" id="todo-page">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索任务标题或内容...">
      </div>
      <!-- 标签筛选 -->
      <div class="filter-section">
        <div class="filter-group" id="filter-duration">
          <span class="filter-label">时间:</span>
          <button class="filter-btn active" data-value="">全部</button>
          <button class="filter-btn" data-value="长期">长期</button>
          <button class="filter-btn" data-value="短期">短期</button>
        </div>
        <div class="filter-group" id="filter-party">
          <span class="filter-label">甲方:</span>
          <button class="filter-btn active" data-value="">全部</button>
          <button class="filter-btn" data-value="CM">CM</button>
          <button class="filter-btn" data-value="客户">客户</button>
        </div>
        <div class="filter-group" id="filter-category">
          <span class="filter-label">分类:</span>
          <button class="filter-btn active" data-value="">全部</button>
          <button class="filter-btn" data-value="采购">采购</button>
          <button class="filter-btn" data-value="生产">生产</button>
          <button class="filter-btn" data-value="其他">其他</button>
        </div>
        <div class="filter-group" id="filter-sort">
          <span class="filter-label">排序:</span>
          <button class="filter-btn active" data-value="created">按添加时间</button>
          <button class="filter-btn" data-value="deadline">按截止时间</button>
        </div>
      </div>
      <ul class="todo-list" id="todo-list"></ul>
    </div>

    <!-- 月度统计页面 -->
    <div class="page" id="stats-page">
      <div class="month-stats-page" id="month-stats-content">
        <div class="stats-empty">暂无已完成任务</div>
      </div>
    </div>
  </div>

  <!-- 添加按钮 -->
  <button class="add-btn" id="add-btn">+</button>

  <!-- 添加任务弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>添加新任务</h2>
      <input type="text" id="title-input" placeholder="输入任务标题" maxlength="50">
      <textarea id="todo-input" placeholder="输入任务内容（可选）" maxlength="500" style="margin-top: 12px;"></textarea>

      <!-- 时间类型 -->
      <div class="tag-section">
        <label>时间类型</label>
        <div class="tag-options" id="duration-tags">
          <label class="tag-option selected">
            <input type="radio" name="duration" value="长期" checked> 长期
          </label>
          <label class="tag-option">
            <input type="radio" name="duration" value="短期"> 短期
          </label>
        </div>
      </div>

      <!-- 甲方 -->
      <div class="tag-section">
        <label>甲方</label>
        <div class="tag-options" id="party-tags">
          <label class="tag-option selected">
            <input type="radio" name="party" value="CM" checked> CM
          </label>
          <label class="tag-option">
            <input type="radio" name="party" value="客户"> 客户
          </label>
        </div>
      </div>

      <!-- 分类 -->
      <div class="tag-section">
        <label>分类</label>
        <div class="tag-options" id="category-tags">
          <label class="tag-option selected">
            <input type="radio" name="category" value="采购" checked> 采购
          </label>
          <label class="tag-option">
            <input type="radio" name="category" value="生产"> 生产
          </label>
          <label class="tag-option">
            <input type="radio" name="category" value="其他"> 其他
          </label>
        </div>
      </div>

      <!-- 截止时间 -->
      <div class="tag-section">
        <label>截止时间（可选）</label>
        <input type="datetime-local" id="deadline-input" style="width: 100%; padding: 12px 14px; border: 2px solid #b8d4e8; border-radius: 10px; font-size: 16px; outline: none;">
        <button type="button" onclick="document.getElementById('deadline-input').value = ''" style="margin-top: 8px; padding: 6px 12px; background: #e2e8f0; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: #4a5568;">清除截止时间</button>
      </div>

      <!-- 提醒设置 -->
      <div class="tag-section">
        <label>提醒（可选）</label>
        <div class="tag-options" id="reminder-type-tags">
          <label class="tag-option selected">
            <input type="radio" name="reminder_type" value="none" checked> 无
          </label>
          <label class="tag-option">
            <input type="radio" name="reminder_type" value="once"> 单次
          </label>
          <label class="tag-option">
            <input type="radio" name="reminder_type" value="daily"> 每天
          </label>
          <label class="tag-option">
            <input type="radio" name="reminder_type" value="weekly"> 每周
          </label>
          <label class="tag-option">
            <input type="radio" name="reminder_type" value="monthly"> 每月
          </label>
        </div>
        <input type="time" id="reminder-time-input" style="margin-top: 10px; width: 100%; padding: 12px 14px; border: 2px solid #b8d4e8; border-radius: 10px; font-size: 16px; outline: none;">
        <p style="font-size: 12px; color: #718096; margin-top: 6px;">* 单次提醒需要设置具体时间，其他类型只需设置时间点</p>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" id="btn-cancel">取消</button>
        <button class="btn-confirm" id="btn-confirm">添加</button>
      </div>
    </div>
  </div>

  <!-- 任务详情弹窗 -->
  <div class="modal-overlay detail-modal" id="detail-modal">
    <div class="modal">
      <div class="detail-header">
        <span class="detail-title" id="detail-title"></span>
      </div>
      <div class="detail-tags" id="detail-tags"></div>

      <div class="detail-section">
        <h4>任务内容</h4>
        <p class="detail-text" id="detail-text"></p>
      </div>

      <div class="detail-section">
        <h4>进度记录</h4>
        <div class="progress-list" id="progress-list"></div>
      </div>

      <div class="add-progress-section">
        <h4>添加进度</h4>
        <textarea id="progress-input" placeholder="记录最新进度..." maxlength="500"></textarea>
        <div class="modal-buttons">
          <button class="btn-cancel" id="btn-close-detail">关闭</button>
          <button class="btn-confirm" id="btn-add-progress">添加进度</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 数据状态
    let todos = [];

    const todoList = document.getElementById('todo-list');
    const completedCount = document.getElementById('completed-count');
    const totalCount = document.getElementById('total-count');
    const monthStatsContent = document.getElementById('month-stats-content');
    const searchInput = document.getElementById('search-input');

    // 添加任务弹窗元素
    const addBtn = document.getElementById('add-btn');
    const modal = document.getElementById('modal');
    const titleInput = document.getElementById('title-input');
    const todoInput = document.getElementById('todo-input');
    const btnCancel = document.getElementById('btn-cancel');
    const btnConfirm = document.getElementById('btn-confirm');
    const durationTags = document.getElementById('duration-tags');
    const partyTags = document.getElementById('party-tags');
    const categoryTags = document.getElementById('category-tags');

    // 任务详情弹窗元素
    const detailModal = document.getElementById('detail-modal');
    const detailTitle = document.getElementById('detail-title');
    const detailTags = document.getElementById('detail-tags');
    const detailText = document.getElementById('detail-text');
    const progressList = document.getElementById('progress-list');
    const progressInput = document.getElementById('progress-input');
    const btnCloseDetail = document.getElementById('btn-close-detail');
    const btnAddProgress = document.getElementById('btn-add-progress');

    let currentTodoId = null;

    // 打开添加弹窗
    addBtn.addEventListener('click', () => {
      modal.classList.add('show');
      titleInput.value = '';
      todoInput.value = '';
      document.getElementById('deadline-input').value = '';
      document.getElementById('reminder-time-input').value = '';
      document.querySelectorAll('#reminder-type-tags .tag-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      document.querySelector('#reminder-type-tags .tag-option:first-child').classList.add('selected');
      resetTagSelection();
      titleInput.focus();
    });

    // 重置标签选择
    function resetTagSelection() {
      document.querySelectorAll('.tag-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      durationTags.querySelector('.tag-option').classList.add('selected');
      partyTags.querySelector('.tag-option').classList.add('selected');
      categoryTags.querySelector('.tag-option').classList.add('selected');
    }

    // 标签点击选择
    document.querySelectorAll('.tag-option').forEach(option => {
      option.addEventListener('click', () => {
        const parent = option.parentElement;
        parent.querySelectorAll('.tag-option').forEach(opt => {
          opt.classList.remove('selected');
        });
        option.classList.add('selected');
      });
    });

    // 关闭弹窗
    function closeModal() {
      modal.classList.remove('show');
    }

    btnCancel.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // 确认添加
    btnConfirm.addEventListener('click', handleAddTodo);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleAddTodo();
    });

    // Tab 切换
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.page').forEach(page => {
          page.classList.remove('active');
        });
        document.getElementById(`${tab}-page`).classList.add('active');
        if (tab === 'stats') renderMonthlyStats();
      });
    });

    // 搜索功能
    searchInput.addEventListener('input', () => {
      renderTodos();
    });

    // 标签筛选状态
    let filterState = {
      duration: '',
      party: '',
      category: '',
      sort: 'created'
    };

    // 标签筛选功能
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.parentElement;
        const groupId = group.id;
        const value = btn.dataset.value;
        group.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterState[groupId.replace('filter-', '')] = value;
        renderTodos();
      });
    });

    // 格式化时间
    function formatTime(timestamp) {
      if (!timestamp) return '-';
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    // 获取月份Key
    function getMonthKey(timestamp) {
      if (!timestamp) return null;
      const date = new Date(timestamp);
      return `${date.getFullYear()}年${date.getMonth() + 1}月`;
    }

    // 按月份分组已完成任务
    function getCompletedByMonth() {
      const completed = todos.filter(t => t.completed && t.completed_at);
      const grouped = {};
      completed.forEach(todo => {
        // 按截止时间排序
        const sortKey = todo.deadline || todo.completed_at;
        const key = getMonthKey(sortKey);
        if (key) {
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(todo);
        }
      });
      // 每个月份内按截止时间排序
      Object.values(grouped).forEach(group => {
        group.sort((a, b) => {
          const aKey = a.deadline || a.completed_at;
          const bKey = b.deadline || b.completed_at;
          return aKey - bKey;
        });
      });
      return grouped;
    }

    // 按月份分组所有任务（已完成和未完成）
    function getAllByMonth() {
      const grouped = {};
      todos.forEach(todo => {
        // 按截止时间排序，没有截止时间则按创建时间
        const sortKey = todo.deadline || todo.created_at;
        const key = getMonthKey(sortKey);
        if (key) {
          if (!grouped[key]) grouped[key] = { total: 0, completed: 0, tasks: [] };
          grouped[key].total++;
          if (todo.completed) grouped[key].completed++;
          grouped[key].tasks.push(todo);
        }
      });
      // 每个月份内按截止时间排序（过期任务排前面）
      Object.values(grouped).forEach(group => {
        group.tasks.sort((a, b) => {
          const aKey = a.deadline || a.created_at;
          const bKey = b.deadline || b.created_at;
          return aKey - bKey;
        });
      });
      return grouped;
    }

    // 渲染月度统计
    function renderMonthlyStats() {
      const grouped = getAllByMonth();
      // 按截止时间排序月份
      const months = Object.keys(grouped).sort((a, b) => {
        const aKey = grouped[a].tasks[0]?.deadline || grouped[a].tasks[0]?.created_at;
        const bKey = grouped[b].tasks[0]?.deadline || grouped[b].tasks[0]?.created_at;
        return bKey - aKey;
      });
      if (months.length === 0) {
        monthStatsContent.innerHTML = '<div class="stats-empty">暂无任务数据</div>';
        return;
      }
      let html = '';
      months.forEach(month => {
        const data = grouped[month];
        const { total, completed, tasks } = data;
        const percentage = total > 0 ? (completed / total) * 100 : 0;
        // 已完成任务按截止时间排序（过期排前面）
        const completedTasks = tasks.filter(t => t.completed).sort((a, b) => {
          const aKey = a.deadline || a.completed_at;
          const bKey = b.deadline || b.completed_at;
          return bKey - aKey;
        });

        let tasksHtml = '';
        if (completedTasks.length > 0) {
          completedTasks.forEach(todo => {
            const duration = todo.duration || '长期';
            const party = todo.party || 'CM';
            const category = todo.category || '采购';
            const isOverdue = todo.deadline && Date.now() > todo.deadline;
            tasksHtml += `
                <div class="month-task ${isOverdue ? 'overdue' : ''}" onclick="openTaskFromStats(${todo.id || 0})">
                  <input type="checkbox" checked disabled>
                  <div class="task-content">
                    <span class="task-text">
                      <strong>${escapeHtml(todo.title)}</strong>
                      <span class="tag">${duration} · ${party} · ${category}</span>
                    </span>
                    <span class="complete-time">${todo.deadline ? '截止: ' + formatTime(todo.deadline) + ' | ' : ''}完成: ${formatTime(todo.completed_at)}</span>
                  </div>
                </div>`;
          });
        } else {
          tasksHtml = '<div class="progress-empty">该月暂无完成的任务</div>';
        }

        html += `
          <div class="month-group">
            <div class="month-header" onclick="toggleMonth(this)">
              <span class="month-title">${month}</span>
              <div class="month-bar-container">
                <div class="month-bar">
                  <div class="month-bar-fill" style="width: ${percentage}%"></div>
                </div>
              </div>
              <span class="month-count">${completed}/${total}</span>
            </div>
            <div class="month-tasks">
              ${tasksHtml}
            </div>
          </div>`;
      });
      monthStatsContent.innerHTML = html;
    }

    window.toggleMonth = function(header) {
      header.nextElementSibling.classList.toggle('show');
    };

    window.openTaskFromStats = function(todoId) {
      if (todos.find(t => t.id === todoId)) {
        // 切换到任务列表页面
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-tab="todo"]').classList.add('active');
        document.querySelectorAll('.page').forEach(page => {
          page.classList.remove('active');
        });
        document.getElementById('todo-page').classList.add('active');
        openDetailById(todoId);
      }
    };

    // 打开任务详情
    function openDetailById(todoId) {
      const todo = todos.find(t => t.id === todoId);
      if (!todo) return;
      currentTodoId = todo.id;
      detailTitle.textContent = todo.title;
      detailText.textContent = todo.text || '无';
      const tag = { duration: todo.duration, party: todo.party, category: todo.category };
      detailTags.innerHTML = `
        <span class="tag">${tag.duration}</span>
        <span class="tag">${tag.party}</span>
        <span class="tag">${tag.category}</span>
      `;

      // 渲染进度记录
      const progress = todo.progress || [];
      if (progress.length === 0) {
        progressList.innerHTML = '<div class="progress-empty">暂无进度记录</div>';
      } else {
        progressList.innerHTML = progress.map(p => `
          <div class="progress-item">
            <span class="progress-time">${formatTime(p.time)}</span>
            <span class="progress-content">${escapeHtml(p.content)}</span>
          </div>
        `).join('');
      }

      progressInput.value = '';
      detailModal.classList.add('show');
    }

    // 打开任务详情（兼容旧版索引方式）
    function openDetail(index) {
      if (todos[index]) {
        openDetailById(todos[index].id);
      }
    }

    // 关闭详情弹窗
    function closeDetail() {
      detailModal.classList.remove('show');
      currentTodoId = null;
    }

    btnCloseDetail.addEventListener('click', closeDetail);
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeDetail();
    });

    // 添加进度
    btnAddProgress.addEventListener('click', async () => {
      const content = progressInput.value.trim();
      if (content && currentTodoId !== null) {
        await fetch(`/api/todos/${currentTodoId}/progress`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        await loadTodos();
        renderTodos();
        openDetailById(currentTodoId);
      }
    });

    // 渲染任务列表
    function renderTodos() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      todoList.innerHTML = '';

      // 过滤任务（搜索 + 标签筛选）
      const filteredTodos = todos.filter(todo => {
        const duration = todo.duration || '长期';
        const party = todo.party || 'CM';
        const category = todo.category || '采购';

        // 搜索条件
        const titleMatch = todo.title.toLowerCase().includes(searchTerm);
        const textMatch = todo.text && todo.text.toLowerCase().includes(searchTerm);
        // 搜索进度记录内容
        const progressMatch = todo.progress && todo.progress.some(p =>
          p.content && p.content.toLowerCase().includes(searchTerm)
        );
        const searchMatch = !searchTerm || titleMatch || textMatch || progressMatch;

        // 标签筛选条件
        const durationMatch = !filterState.duration || duration === filterState.duration;
        const partyMatch = !filterState.party || party === filterState.party;
        const categoryMatch = !filterState.category || category === filterState.category;

        return searchMatch && durationMatch && partyMatch && categoryMatch;
      });

      // 排序
      filteredTodos.sort((a, b) => {
        if (filterState.sort === 'deadline') {
          // 按截止时间排序：有截止时间的排前面，过期的更靠前
          if (!a.deadline && !b.deadline) return b.created_at - a.created_at;
          if (!a.deadline) return 1;  // a没有截止时间排后面
          if (!b.deadline) return -1; // b没有截止时间排前面
          // 都有限制时间，过期的排前面
          const aOverdue = !a.completed && Date.now() > a.deadline;
          const bOverdue = !b.completed && Date.now() > b.deadline;
          if (aOverdue && !bOverdue) return -1;
          if (!aOverdue && bOverdue) return 1;
          return a.deadline - b.deadline;
        } else {
          // 按添加时间排序（默认）
          return b.created_at - a.created_at;
        }
      });

      if (filteredTodos.length === 0) {
        todoList.innerHTML = `
          <li class="empty-state">
            <div class="icon">📝</div>
            <p>${searchTerm ? '未找到匹配的任务' : '暂无任务'}</p>
          </li>
        `;
      } else {
        filteredTodos.forEach((todo, index) => {
          const duration = todo.duration || '长期';
          const party = todo.party || 'CM';
          const category = todo.category || '采购';
          const isOverdue = todo.deadline && !todo.completed && Date.now() > todo.deadline;
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}`;
          li.innerHTML = `
            <input type="checkbox" ${todo.completed ? 'checked disabled' : ''}>
            <div class="content">
              <div class="title-row">
                <span class="text">${escapeHtml(todo.title)}</span>
                <span class="tag">${duration} · ${party} · ${category}</span>
              </div>
              ${todo.text ? `<span class="desc">${escapeHtml(todo.text)}</span>` : ''}
              <div class="times">
                <span class="time-item">
                  <span class="time-label">添加:</span>
                  <span class="time-value">${formatTime(todo.created_at)}</span>
                </span>
                ${todo.deadline ? `
                <span class="time-item ${isOverdue ? 'overdue-time' : ''}">
                  <span class="time-label">截止:</span>
                  <span class="time-value">${formatTime(todo.deadline)}</span>
                </span>
                ` : ''}
                ${todo.completed ? `
                <span class="time-item">
                  <span class="time-label">完成:</span>
                  <span class="time-value">${formatTime(todo.completed_at)}</span>
                </span>
                ` : ''}
                ${(todo.progress && todo.progress.length) ? `
                <span class="time-item">
                  <span class="time-label">进度:</span>
                  <span class="time-value">${todo.progress.length}条</span>
                </span>
                ` : ''}
                ${todo.reminder_type && todo.reminder_type !== 'none' ? `
                <span class="time-item reminder-item">
                  <span class="time-label">提醒:</span>
                  <span class="time-value">${todo.reminder_type === 'once' ? '单次' : todo.reminder_type === 'daily' ? '每天' : todo.reminder_type === 'weekly' ? '每周' : todo.reminder_type === 'monthly' ? '每月' : ''} ${formatTime(todo.reminder_time).split(' ')[1] || ''}</span>
                </span>
                ` : ''}
              </div>
            </div>
            <button class="edit-btn" title="详情">✎</button>
            <button class="delete-btn" title="删除">×</button>
          `;

          // 点击任务项打开详情（除了复选框和按钮）
          li.addEventListener('click', (e) => {
            if (!e.target.classList.contains('delete-btn') &&
                !e.target.classList.contains('edit-btn') &&
                !e.target.matches('input[type="checkbox"]')) {
              openDetail(index);
            }
          });

          // 复选框点击
          const checkbox = li.querySelector('input');
          checkbox.addEventListener('change', async (e) => {
            e.stopPropagation();
            const todo = todos[index];
            if (todo.completed) {
              // 已完成的任务不允许取消
              return;
            }
            if (confirm('确定要将此任务标记为完成吗？任务完成后将无法取消。')) {
              await fetch(`/api/todos/${todo.id}/completed`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: true })
              });
              await loadTodos();
              renderTodos();
            } else {
              // 用户取消，恢复复选框状态
              e.target.checked = false;
            }
          });

          // 编辑按钮
          li.querySelector('.edit-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openDetail(index);
          });

          // 删除按钮
          li.querySelector('.delete-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            const todo = todos[index];
            if (confirm('确定要删除这个任务吗？')) {
              await fetch(`/api/todos/${todo.id}`, { method: 'DELETE' });
              await loadTodos();
              renderTodos();
            }
          });

          todoList.appendChild(li);
        });
      }

      // 更新统计
      const completed = todos.filter(t => t.completed).length;
      completedCount.textContent = completed;
      totalCount.textContent = todos.length;
    }

    // HTML 转义
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 添加任务
    async function handleAddTodo() {
      const title = titleInput.value.trim();
      const text = todoInput.value.trim();
      const deadlineInput = document.getElementById('deadline-input').value;
      const deadline = deadlineInput ? new Date(deadlineInput).getTime() : null;

      // 获取提醒设置
      const reminderTypeInput = document.querySelector('input[name="reminder_type"]:checked');
      const reminderType = reminderTypeInput ? reminderTypeInput.value : 'none';
      const reminderTimeInput = document.getElementById('reminder-time-input').value;

      let reminderTime = null;
      if (reminderType !== 'none' && reminderTimeInput) {
        const now = new Date();
        if (reminderType === 'once') {
          // 单次提醒：使用设置的日期时间
          const [hours, minutes] = reminderTimeInput.split(':');
          const deadlineDate = new Date(deadlineInput ? new Date(deadlineInput) : now);
          deadlineDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);
          reminderTime = deadlineDate.getTime();
        } else {
          // 周期提醒：只使用时间，每天/每周/每月触发
          const [hours, minutes] = reminderTimeInput.split(':');
          const today = new Date();
          today.setHours(parseInt(hours), parseInt(minutes), 0, 0);
          reminderTime = today.getTime();
        }
      }

      if (title) {
        const { duration, party, category } = getSelectedTags();
        await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, text, duration, party, category, deadline, reminder_time: reminderTime, reminder_type: reminderType })
        });
        await loadTodos();
        renderTodos();
        closeModal();
      }
    }

    function getSelectedTags() {
      const duration = durationTags.querySelector('.tag-option.selected input').value;
      const party = partyTags.querySelector('.tag-option.selected input').value;
      const category = categoryTags.querySelector('.tag-option.selected input').value;
      return { duration, party, category };
    }

    // 从服务器加载任务列表
    async function loadTodos() {
      const res = await fetch('/api/todos');
      todos = await res.json();
    }

    // 初始化应用
    async function initApp() {
      try {
        await loadTodos();
        renderTodos();
      } catch (err) {
        console.error('加载数据失败:', err);
        alert('加载数据失败，请刷新页面重试');
      }
    }

    // 初始渲染
    initApp();
  </script>
</body>
</html>
